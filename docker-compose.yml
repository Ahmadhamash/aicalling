# Local development stack: app + Qdrant + Redis.
# Usage:  docker compose up --build
# Then ingest sample data:  docker compose exec app python -m scripts.ingest

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Point the app at the sibling containers (override the .env defaults).
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
